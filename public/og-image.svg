<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative circuit pattern -->
  <g opacity="0.1" stroke="#3b82f6" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="40"/>
    <circle cx="1100" cy="530" r="60"/>
    <circle cx="200" cy="500" r="30"/>
    <line x1="100" y1="100" x2="200" y2="500"/>
    <line x1="200" y1="500" x2="1100" y2="530"/>
    <circle cx="900" cy="100" r="50"/>
    <line x1="900" y1="100" x2="1100" y2="530"/>
  </g>

  <!-- Lock icon with shield -->
  <g transform="translate(150, 180)">
    <!-- Shield -->
    <path d="M 60 0 L 120 20 L 120 80 Q 120 120 60 140 Q 0 120 0 80 L 0 20 Z"
          fill="url(#accent-gradient)" opacity="0.3" filter="url(#glow)"/>
    <path d="M 60 0 L 120 20 L 120 80 Q 120 120 60 140 Q 0 120 0 80 L 0 20 Z"
          fill="none" stroke="url(#accent-gradient)" stroke-width="3"/>

    <!-- Lock -->
    <rect x="40" y="70" width="40" height="50" rx="5"
          fill="#3b82f6" opacity="0.8"/>
    <rect x="45" y="75" width="30" height="40" rx="3"
          fill="#1e293b"/>
    <circle cx="60" cy="95" r="6" fill="#3b82f6"/>
    <rect x="57" y="95" width="6" height="12" rx="1" fill="#3b82f6"/>

    <!-- Lock shackle -->
    <path d="M 45 70 L 45 50 Q 45 30 60 30 Q 75 30 75 50 L 75 70"
          fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Key icon -->
  <g transform="translate(950, 200)">
    <circle cx="30" cy="30" r="25" fill="none" stroke="#8b5cf6" stroke-width="6"/>
    <circle cx="30" cy="30" r="12" fill="#8b5cf6" opacity="0.5"/>
    <line x1="30" y1="30" x2="120" y2="30" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
    <rect x="80" y="20" width="8" height="20" fill="#8b5cf6"/>
    <rect x="100" y="20" width="8" height="20" fill="#8b5cf6"/>
  </g>

  <!-- Main title -->
  <text x="600" y="280"
        font-family="Arial, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle">
    CryptoTools
  </text>

  <!-- Subtitle -->
  <text x="600" y="340"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="#94a3b8"
        text-anchor="middle">
    Professional Cryptographic Toolkit
  </text>

  <!-- Feature badges -->
  <g transform="translate(300, 400)">
    <!-- Badge 1: Quantum-Safe -->
    <rect x="0" y="0" width="180" height="60" rx="30"
          fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="38"
          font-family="Arial, sans-serif"
          font-size="18"
          fill="#3b82f6"
          text-anchor="middle">
      🔐 Quantum-Safe
    </text>
  </g>

  <g transform="translate(510, 400)">
    <!-- Badge 2: 18 Tools -->
    <rect x="0" y="0" width="180" height="60" rx="30"
          fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="90" y="38"
          font-family="Arial, sans-serif"
          font-size="18"
          fill="#8b5cf6"
          text-anchor="middle">
      🛠️ 18 Tools
    </text>
  </g>

  <g transform="translate(720, 400)">
    <!-- Badge 3: Browser-Based -->
    <rect x="0" y="0" width="180" height="60" rx="30"
          fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="38"
          font-family="Arial, sans-serif"
          font-size="18"
          fill="#3b82f6"
          text-anchor="middle">
      🌐 Browser-Based
    </text>
  </g>

  <!-- Bottom line -->
  <text x="600" y="550"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#64748b"
        text-anchor="middle">
    AES • RSA • Kyber • Dilithium • BLAKE2 • SHA-3
  </text>

  <!-- Domain -->
  <text x="600" y="590"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="url(#accent-gradient)"
        text-anchor="middle">
    cryptotools.dev
  </text>
</svg>
